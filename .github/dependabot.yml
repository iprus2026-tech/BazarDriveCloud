# Dependabot configuration.
# The runtime PWA in public/ is dependency-free (no package.json), so the only
# npm surface is the docs-site Docusaurus layer. GitHub Actions workflows are
# also kept current. See docs-site/package.json and .github/workflows/.
version: 2
updates:
  # Docusaurus docs-site dependencies.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      docs-site-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docs-site"
    ignore:
      # Advisories that are currently unactionable here. Each ignore is BOUND to
      # the present vulnerable/no-fix range via `versions`, not the whole
      # package, so Dependabot resumes automatically once a patched release
      # becomes resolvable (no manual config edit needed). Revisit on Docusaurus
      # bumps. Tracked: GHSA-w5hq-g745-h8pq (uuid), js-yaml merge-key DoS.
      - dependency-name: "uuid"
        # Patched >= 11.1.1, but the tree is pinned to uuid@8.3.2 via sockjs.
        versions: ["< 11.1.1"]
      - dependency-name: "js-yaml"
        # Direct devDep; advisory range <= 4.1.1 with no upstream fix yet.
        versions: ["<= 4.1.1"]

  # GitHub Actions used across the CI / Pages workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
