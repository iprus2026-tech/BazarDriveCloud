# Dependabot configuration.
# The runtime PWA in public/ is dependency-free (no package.json). The npm surfaces
# are the docs-site Docusaurus layer and the in-repo backend (/server, Fastify/pg).
# GitHub Actions workflows are also kept current.
# See docs-site/package.json, server/package.json, and .github/workflows/.
version: 2
updates:
  # Docusaurus docs-site dependencies.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      docs-site-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docs-site"

  # In-repo backend (/server) — Fastify / pg production deps (ADR BD-DOCS-041).
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      server-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "server"

  # GitHub Actions used across the CI / Pages workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
