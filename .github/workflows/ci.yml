name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # full history so the precache-drift guard can diff vs the PR base
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Static checks (CSP guards, JSON, JS syntax)
        run: node scripts/check.mjs
      - name: Precache-drift guard (a precached file changed ⇒ sw.js VERSION must bump)
        if: github.event_name == 'pull_request'
        run: node scripts/check-precache-drift.mjs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
