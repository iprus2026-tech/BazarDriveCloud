name: docs-site-ci

# BD-DOCS-SITE-01 — builds the standalone Docusaurus docs shell in docs-site/.
# Scoped to docs-site so it never runs for runtime-PWA-only changes, and it is
# fully separate from the existing GitHub Pages PWA workflow (which it does not
# touch). It only builds — no deploy at this step.
on:
  # Also trigger on the legacy documents scanned by
  # validate-document-registry.mjs (README, ROADMAP, docs/**) and on CLAUDE.md
  # (a declared Mini-Yonder core file), so a legacy-doc-only or CLAUDE.md-only
  # change still runs `npm run check` (frontmatter + registry + self + build).
  # The root .nvmrc is listed too: Setup Node reads it, so a Node-version-only
  # change must still prove the Docusaurus install/build.
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site-ci.yml'
      - '.nvmrc'
      - 'README.md'
      - 'ROADMAP.md'
      - 'docs/**/*.md'
      - 'docs/**/*.json'
      - 'CLAUDE.md'
  push:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site-ci.yml'
      - '.nvmrc'
      - 'README.md'
      - 'ROADMAP.md'
      - 'docs/**/*.md'
      - 'docs/**/*.json'
      - 'CLAUDE.md'

# Least privilege: build-only (checkout + npm ci + npm run check); nothing is written back.
permissions:
  contents: read

jobs:
  build:
    name: build docs-site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate frontmatter and build docs site
        run: npm run check
