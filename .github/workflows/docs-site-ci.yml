name: docs-site-ci

# BD-DOCS-SITE-01 — builds the standalone Docusaurus docs shell in docs-site/.
# Scoped to docs-site so it never runs for runtime-PWA-only changes, and it is
# fully separate from the existing GitHub Pages PWA workflow (which it does not
# touch). It only builds — no deploy at this step.
on:
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site-ci.yml'
  push:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site-ci.yml'

jobs:
  build:
    name: build docs-site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate frontmatter and build docs site
        run: npm run check
