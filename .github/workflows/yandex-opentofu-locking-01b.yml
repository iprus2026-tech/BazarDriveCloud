name: BD-BACKEND-DEPLOY-01B OpenTofu native S3 locking proof

# Issue #862, 01B only.
#
# Two separately armed phases validate native OpenTofu S3 locking against one
# disposable Yandex Object Storage bucket:
#   LOCK_TEST -> baseline state, concurrent rejection, normal unlock, rewrite,
#                and a controlled SIGKILL that leaves one exact stale lock.
#   RECOVERY  -> separately approved force-unlock of that exact lock, integrity
#                verification, a final inert write, and current-object cleanup.
#
# Contract-only by default. PROOF_PHASE, temporary IAM/WIF IDs, the disposable
# bucket, and the stale lock ID remain PENDING until the required reviews and
# human approvals are recorded. The PENDING gate exits before any OIDC request,
# Yandex/S3 request, OpenTofu download, or OpenTofu execution.
#
# Forbidden here: YDB/DynamoDB fallback, provider-managed Yandex resources,
# real staging state, PostgreSQL, Serverless Containers, application/runtime
# changes, static AWS credentials, JSON service-account keys, artifacts, and
# any force-unlock that is not tied to the separately approved exact lock ID.

on:
  push:
    branches:
      - infra/backend-deploy-01b-opentofu-locking

permissions:
  contents: read

concurrency:
  group: bd-backend-deploy-01b-opentofu-locking
  cancel-in-progress: false

jobs:
  native-s3-locking-proof:
    name: OpenTofu native S3 lock conflict and recovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PROOF_PHASE: PENDING
      OPEN_TOFU_VERSION: 1.12.0
      EXPECTED_ISSUER: https://token.actions.githubusercontent.com
      EXPECTED_GITHUB_AUDIENCE: https://github.com/iprus2026-tech
      EXPECTED_SUBJECT: repo:iprus2026-tech/BazarDriveCloud:ref:refs/heads/infra/backend-deploy-01b-opentofu-locking
      EXPECTED_REPOSITORY: iprus2026-tech/BazarDriveCloud
      EXPECTED_REF: refs/heads/infra/backend-deploy-01b-opentofu-locking
      YANDEX_SERVICE_ACCOUNT_ID: PENDING
      YANDEX_FEDERATION_ID: PENDING
      YANDEX_BUCKET: PENDING
      STALE_LOCK_ID: PENDING
      YANDEX_TOKEN_ENDPOINT: https://auth.yandex.cloud/oauth/token
      YANDEX_EPHEMERAL_ENDPOINT: https://iam.api.cloud.yandex.net/iam/aws-compatibility/v1/ephemeralAccessKeys
      YANDEX_S3_ENDPOINT: https://storage.yandexcloud.net
      YANDEX_REGION: ru-central1
      APPROVED_VALIDATION_FOLDER_ID: b1gh8nb79rifsekssbgu
      REQUESTED_EPHEMERAL_DURATION: 900s
      STATE_KEY: 01b/terraform.tfstate
      LOCK_KEY: 01b/terraform.tfstate.tflock
      LOCK_HOLD_SECONDS: "45"
      MAX_BUCKET_BYTES: "10485760"
      BUDGET_CEILING_RUB: "500"
      CLEANUP_DEADLINE_MINUTES: "60"
      TF_IN_AUTOMATION: "1"
    steps:
      - name: Contract gate and secret-safe native locking proof
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${PROOF_PHASE}" == "PENDING" ]]; then
            if [[ "${YANDEX_SERVICE_ACCOUNT_ID}" != "PENDING" || \
                  "${YANDEX_FEDERATION_ID}" != "PENDING" || \
                  "${YANDEX_BUCKET}" != "PENDING" || \
                  "${STALE_LOCK_ID}" != "PENDING" ]]; then
              echo '01B contract violation: partial arming is forbidden.'
              exit 1
            fi

            echo '01B contract-only marker: execution is not armed; no proof endpoint was contacted and OpenTofu was not downloaded or run.'
            {
              echo '## BD-BACKEND-DEPLOY-01B — contract only'
              echo
              echo '- Execution armed: `NO`'
              echo '- Proof phase: `PENDING`'
              echo "- OpenTofu pinned version: \`${OPEN_TOFU_VERSION}\`"
              echo "- Remote state key: \`${STATE_KEY}\`"
              echo "- Native lock key: \`${LOCK_KEY}\`"
              echo "- Budget ceiling: \`${BUDGET_CEILING_RUB} RUB\`"
              echo "- Full cleanup deadline after a terminal result/stop: \`${CLEANUP_DEADLINE_MINUTES} minutes\`"
              echo '- GitHub OIDC requested: `NO`'
              echo '- Yandex IAM/WIF contacted: `NO`'
              echo '- Object Storage contacted: `NO`'
              echo '- OpenTofu downloaded/run: `NO`'
              echo '- `tofu apply` run: `NO`'
              echo '- `tofu force-unlock` run: `NO`'
              echo '- Static/JSON credential used: `NO`'
              echo '- YDB/DynamoDB fallback used: `NO`'
              echo '- Workflow artifacts created: `NO`'
              echo
              echo 'LOCK_TEST requires a reviewed resource manifest and separate arming approval.'
              echo 'RECOVERY additionally requires a separately approved exact stale lock ID.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          case "${PROOF_PHASE}" in
            LOCK_TEST)
              [[ "${STALE_LOCK_ID}" == "PENDING" ]] || {
                echo '01B contract violation: LOCK_TEST must not be armed with a stale lock ID.'
                exit 1
              }
              ;;
            RECOVERY)
              [[ "${STALE_LOCK_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || {
                echo '01B contract violation: RECOVERY requires one exact UUID lock ID.'
                exit 1
              }
              ;;
            *)
              echo '01B contract violation: PROOF_PHASE must be PENDING, LOCK_TEST, or RECOVERY.'
              exit 1
              ;;
          esac

          [[ "${OPEN_TOFU_VERSION}" == "1.12.0" ]]
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${GITHUB_REF}" == "${EXPECTED_REF}" ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo '01B stop condition: credential-bearing workflow reruns are forbidden; publish and audit a new exact HEAD instead.'
            exit 1
          fi
          [[ "${YANDEX_SERVICE_ACCOUNT_ID}" =~ ^[a-z0-9]+$ ]]
          [[ "${YANDEX_FEDERATION_ID}" =~ ^[a-z0-9]+$ ]]
          [[ "${YANDEX_BUCKET}" =~ ^bd-state-val-01b-[0-9]{8}-[a-z0-9-]+$ ]]
          [[ "${STATE_KEY}" == "01b/terraform.tfstate" ]]
          [[ "${LOCK_KEY}" == "${STATE_KEY}.tflock" ]]
          [[ "${LOCK_HOLD_SECONDS}" == "45" ]]
          [[ "${MAX_BUCKET_BYTES}" == "10485760" ]]
          [[ "${APPROVED_VALIDATION_FOLDER_ID}" == "b1gh8nb79rifsekssbgu" ]]
          [[ "${BUDGET_CEILING_RUB}" == "500" ]]
          [[ "${CLEANUP_DEADLINE_MINUTES}" == "60" ]]

          if [[ -n "${AWS_ACCESS_KEY_ID:-}" || \
                -n "${AWS_SECRET_ACCESS_KEY:-}" || \
                -n "${AWS_SESSION_TOKEN:-}" || \
                -n "${AWS_PROFILE:-}" ]]; then
            echo 'unexpected_ambient_aws_credentials=YES'
            exit 1
          fi

          workdir="$(mktemp -d)"
          active_pid=''
          cleanup() {
            set +e
            if [[ -n "${active_pid:-}" ]] && kill -0 "${active_pid}" 2>/dev/null; then
              kill -KILL -- "-${active_pid}" 2>/dev/null || true
              wait "${active_pid}" 2>/dev/null || true
            fi
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            unset AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE AWS_PROFILE
            unset oidc_token iam_token access_key_id secret_access_key session_token
            rm -rf "${workdir}"
          }
          trap cleanup EXIT

          echo '01B marker: installing pinned OpenTofu release before requesting credentials'
          tofu_zip="tofu_${OPEN_TOFU_VERSION}_linux_amd64.zip"
          tofu_base_url="https://github.com/opentofu/opentofu/releases/download/v${OPEN_TOFU_VERSION}"
          curl --fail --silent --show-error --location \
            "${tofu_base_url}/${tofu_zip}" \
            --output "${workdir}/${tofu_zip}"
          curl --fail --silent --show-error --location \
            "${tofu_base_url}/tofu_${OPEN_TOFU_VERSION}_SHA256SUMS" \
            --output "${workdir}/SHA256SUMS"
          (
            cd "${workdir}"
            grep " ${tofu_zip}$" SHA256SUMS | sha256sum --check --strict -
            unzip -q "${tofu_zip}"
          )
          tofu_bin="${workdir}/tofu"
          [[ -x "${tofu_bin}" ]]
          tofu_version_line="$(${tofu_bin} version | head -n1)"
          [[ "${tofu_version_line}" == "OpenTofu v${OPEN_TOFU_VERSION}" ]]
          echo "opentofu_version=${OPEN_TOFU_VERSION}"

          echo '01B marker: requesting GitHub OIDC token'
          oidc_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${EXPECTED_GITHUB_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"${oidc_response}")"
          echo "::add-mask::${oidc_token}"

          payload_b64="${oidc_token#*.}"
          payload_b64="${payload_b64%%.*}"
          claims="$(PAYLOAD_B64="${payload_b64}" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ['PAYLOAD_B64']
          payload += '=' * (-len(payload) % 4)
          decoded = base64.urlsafe_b64decode(payload.encode('ascii'))
          obj = json.loads(decoded)
          safe_keys = (
              'iss', 'aud', 'sub', 'repository', 'ref', 'sha',
              'workflow', 'iat', 'exp'
          )
          print(json.dumps({key: obj.get(key) for key in safe_keys}, separators=(',', ':')))
          PY
          )"

          issuer="$(jq -er '.iss' <<<"${claims}")"
          github_audience="$(jq -er '.aud' <<<"${claims}")"
          subject="$(jq -er '.sub' <<<"${claims}")"
          repository="$(jq -er '.repository' <<<"${claims}")"
          ref="$(jq -er '.ref' <<<"${claims}")"
          sha="$(jq -er '.sha' <<<"${claims}")"
          workflow="$(jq -er '.workflow' <<<"${claims}")"
          issued_at="$(jq -er '.iat' <<<"${claims}")"
          expires_at="$(jq -er '.exp' <<<"${claims}")"
          oidc_ttl_seconds="$((expires_at - issued_at))"

          [[ "${issuer}" == "${EXPECTED_ISSUER}" ]]
          [[ "${github_audience}" == "${EXPECTED_GITHUB_AUDIENCE}" ]]
          [[ "${subject}" == "${EXPECTED_SUBJECT}" ]]
          [[ "${repository}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${ref}" == "${EXPECTED_REF}" ]]
          [[ "${sha}" == "${GITHUB_SHA}" ]]
          [[ "${workflow}" == "BD-BACKEND-DEPLOY-01B OpenTofu native S3 locking proof" ]]
          (( oidc_ttl_seconds > 0 ))
          echo '01B marker: GitHub OIDC claims match the approved exact binding'

          echo '01B marker: exchanging OIDC JWT for a short-lived Yandex IAM token'
          exchange_with_status="$(curl --silent --show-error \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YANDEX_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --write-out $'\n%{http_code}' \
            "${YANDEX_TOKEN_ENDPOINT}")"

          exchange_http_status="${exchange_with_status##*$'\n'}"
          exchange_response="${exchange_with_status%$'\n'*}"
          if [[ "${exchange_http_status}" != "200" ]]; then
            exchange_error_code="$(jq -r '
              if type == "object" then
                (.error // .code // .status // empty)
              else
                empty
              end
            ' <<<"${exchange_response}" 2>/dev/null || true)"
            if [[ -z "${exchange_error_code}" || ! "${exchange_error_code}" =~ ^[A-Za-z0-9_.:/-]{1,128}$ ]]; then
              exchange_error_code=UNAVAILABLE
            fi
            echo "yandex_token_exchange_http_status=${exchange_http_status}"
            echo "yandex_token_exchange_error_code=${exchange_error_code}"
            unset exchange_with_status exchange_response oidc_response payload_b64 oidc_token claims
            exit 1
          fi

          iam_token="$(jq -er '.access_token' <<<"${exchange_response}")"
          echo "::add-mask::${iam_token}"
          iam_token_type="$(jq -er '.token_type' <<<"${exchange_response}")"
          iam_ttl_seconds="$(jq -er '.expires_in' <<<"${exchange_response}")"
          [[ "${iam_token_type}" == "Bearer" ]]
          [[ "${iam_ttl_seconds}" =~ ^[0-9]+$ ]]
          (( iam_ttl_seconds > 0 ))

          unset exchange_with_status exchange_response oidc_response payload_b64 oidc_token claims
          echo '01B marker: Yandex WIF token exchange succeeded'

          session_name="bd-01b-${PROOF_PHASE,,}-${GITHUB_RUN_ID}"
          issue_request_epoch="$(date +%s)"
          issue_body="$(jq -cn \
            --arg subjectId "${YANDEX_SERVICE_ACCOUNT_ID}" \
            --arg sessionName "${session_name}" \
            --arg duration "${REQUESTED_EPHEMERAL_DURATION}" \
            '{subjectId:$subjectId,sessionName:$sessionName,duration:$duration}')"

          echo '01B marker: requesting a 15-minute ephemeral AWS-compatible session credential'
          issue_with_status="$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${iam_token}" \
            --header 'Content-Type: application/json' \
            --data "${issue_body}" \
            --write-out $'\n%{http_code}' \
            "${YANDEX_EPHEMERAL_ENDPOINT}")"

          issue_http_status="${issue_with_status##*$'\n'}"
          issue_response="${issue_with_status%$'\n'*}"
          unset iam_token issue_with_status issue_body
          if [[ "${issue_http_status}" != "200" ]]; then
            issue_error_code="$(jq -r '
              if type == "object" then
                (.error // .code // .status // empty)
              else
                empty
              end
            ' <<<"${issue_response}" 2>/dev/null || true)"
            if [[ -z "${issue_error_code}" || ! "${issue_error_code}" =~ ^[A-Za-z0-9_.:/-]{1,128}$ ]]; then
              issue_error_code=UNAVAILABLE
            fi
            echo "ephemeral_issue_http_status=${issue_http_status}"
            echo "ephemeral_issue_error_code=${issue_error_code}"
            unset issue_response
            exit 1
          fi

          access_key_id="$(jq -er '.accessKeyId' <<<"${issue_response}")"
          secret_access_key="$(jq -er '.secret' <<<"${issue_response}")"
          session_token="$(jq -er '.sessionToken' <<<"${issue_response}")"
          credential_expires_at="$(jq -er '.expiresAt' <<<"${issue_response}")"

          echo "::add-mask::${access_key_id}"
          echo "::add-mask::${secret_access_key}"
          echo "::add-mask::${session_token}"

          [[ -n "${access_key_id}" ]]
          [[ -n "${secret_access_key}" ]]
          [[ -n "${session_token}" ]]
          [[ -n "${credential_expires_at}" ]]

          credential_expires_epoch="$(EXPIRES_AT="${credential_expires_at}" python3 - <<'PY'
          from datetime import datetime, timezone
          import os
          import re

          value = os.environ['EXPIRES_AT']
          match = re.fullmatch(r'(.*?)(?:\.(\d+))?Z', value)
          if not match:
              raise SystemExit('expiresAt is not RFC3339 UTC')
          base, fraction = match.groups()
          fraction = (fraction or '')[:6].ljust(6, '0')
          normalized = f'{base}.{fraction}+00:00'
          dt = datetime.fromisoformat(normalized).astimezone(timezone.utc)
          print(int(dt.timestamp()))
          PY
          )"
          observed_ephemeral_ttl_seconds="$((credential_expires_epoch - issue_request_epoch))"
          (( observed_ephemeral_ttl_seconds >= 840 ))
          (( observed_ephemeral_ttl_seconds <= 930 ))

          unset issue_response

          export AWS_ACCESS_KEY_ID="${access_key_id}"
          export AWS_SECRET_ACCESS_KEY="${secret_access_key}"
          export AWS_SESSION_TOKEN="${session_token}"
          export AWS_REGION="${YANDEX_REGION}"
          export AWS_DEFAULT_REGION="${YANDEX_REGION}"
          export AWS_ENDPOINT_URL_S3="${YANDEX_S3_ENDPOINT}"
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_RETRY_MODE=standard
          export AWS_MAX_ATTEMPTS=1
          export AWS_PAGER=''
          export AWS_CONFIG_FILE="${workdir}/nonexistent-aws-config"
          export AWS_SHARED_CREDENTIALS_FILE="${workdir}/nonexistent-aws-credentials"

          unset access_key_id secret_access_key session_token

          command -v aws >/dev/null
          command -v ps >/dev/null
          command -v setsid >/dev/null
          command -v timeout >/dev/null
          aws_version="$(aws --version 2>&1 | head -n1)"
          [[ "${aws_version}" == aws-cli/* ]]

          make_root() {
            local root="$1"
            mkdir -p "${root}"
            cat > "${root}/main.tf" <<'HCL'
          terraform {
            required_version = "= 1.12.0"
            backend "s3" {}
          }

          variable "marker" {
            type    = string
            default = "unused"
          }

          variable "hold_seconds" {
            type    = number
            default = 0
          }

          resource "terraform_data" "locking_probe" {
            input            = var.marker
            triggers_replace = [var.marker]

            provisioner "local-exec" {
              command = "sleep ${var.hold_seconds}"
            }
          }

          output "locking_probe_marker" {
            value = terraform_data.locking_probe.output
          }
          HCL

            cat > "${root}/backend.hcl" <<HCL
          bucket                      = "${YANDEX_BUCKET}"
          key                         = "${STATE_KEY}"
          region                      = "${YANDEX_REGION}"
          endpoints                   = { s3 = "${YANDEX_S3_ENDPOINT}" }
          use_lockfile                = true
          skip_region_validation      = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          max_retries                 = 1
          retry_mode                  = "standard"
          HCL
          }

          init_root() {
            local root="$1"
            local log="$2"
            if ! "${tofu_bin}" -chdir="${root}" init \
              -reconfigure \
              -input=false \
              -no-color \
              -backend-config=backend.hcl >"${log}" 2>&1; then
              echo 'opentofu_init_result=FAIL'
              return 1
            fi
          }

          run_apply() {
            local root="$1"
            local marker="$2"
            local hold_seconds="$3"
            local log="$4"
            if ! "${tofu_bin}" -chdir="${root}" apply \
              -auto-approve \
              -input=false \
              -no-color \
              -lock-timeout=0s \
              -var="marker=${marker}" \
              -var="hold_seconds=${hold_seconds}" >"${log}" 2>&1; then
              echo "opentofu_apply_result=FAIL marker=${marker}"
              return 1
            fi
          }

          s3_head() {
            local key="$1"
            aws s3api head-object \
              --endpoint-url "${YANDEX_S3_ENDPOINT}" \
              --bucket "${YANDEX_BUCKET}" \
              --key "${key}" \
              --output json
          }

          s3_get() {
            local key="$1"
            local destination="$2"
            aws s3api get-object \
              --endpoint-url "${YANDEX_S3_ENDPOINT}" \
              --bucket "${YANDEX_BUCKET}" \
              --key "${key}" \
              --output json \
              "${destination}" >/dev/null
          }

          wait_for_lock_present() {
            local attempt
            for attempt in $(seq 1 30); do
              if s3_head "${LOCK_KEY}" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo 'lock_wait_result=NOT_PRESENT'
            return 1
          }

          wait_for_lock_absent() {
            local attempt
            for attempt in $(seq 1 30); do
              if ! s3_head "${LOCK_KEY}" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo 'lock_wait_result=STILL_PRESENT'
            return 1
          }

          wait_for_hold_marker() {
            local log="$1"
            local attempt
            for attempt in $(seq 1 30); do
              if grep -Eq "Executing:.*sleep ${LOCK_HOLD_SECONDS}" "${log}"; then
                return 0
              fi
              if [[ -n "${active_pid}" ]] && ! kill -0 "${active_pid}" 2>/dev/null; then
                echo 'lock_holder_result=EXITED_BEFORE_HOLD'
                return 1
              fi
              sleep 1
            done
            echo 'lock_holder_result=HOLD_NOT_OBSERVED'
            return 1
          }

          assert_isolated_process_group() {
            local pid="$1"
            local pgid
            pgid="$(ps -o pgid= -p "${pid}" | tr -d '[:space:]')"
            [[ "${pgid}" == "${pid}" ]] || {
              echo 'lock_holder_result=PROCESS_GROUP_NOT_ISOLATED'
              return 1
            }
          }

          read_lock_id() {
            local lock_file
            lock_file="$(mktemp "${workdir}/lock.XXXXXX.json")"
            s3_get "${LOCK_KEY}" "${lock_file}"
            jq -er '.ID | select(type == "string")' "${lock_file}"
            : > "${lock_file}"
            rm -f "${lock_file}"
          }

          read_state_snapshot() {
            local state_file
            state_file="$(mktemp "${workdir}/state.XXXXXX.json")"
            s3_get "${STATE_KEY}" "${state_file}"
            jq -er '
              (.lineage | type == "string" and length > 0) and
              (.serial | type == "number" and . >= 0)
            ' "${state_file}" >/dev/null
            jq -r '[.lineage, (.serial | tostring)] | @tsv' "${state_file}"
            : > "${state_file}"
            rm -f "${state_file}"
          }

          read_state_etag() {
            s3_head "${STATE_KEY}" | jq -er '.ETag | select(type == "string" and length > 0)'
          }

          read_lock_etag() {
            s3_head "${LOCK_KEY}" | jq -er '.ETag | select(type == "string" and length > 0)'
          }

          verify_inventory() {
            local inventory
            local versions
            local delete_markers
            local total_bytes
            inventory="$(aws s3api list-object-versions \
              --endpoint-url "${YANDEX_S3_ENDPOINT}" \
              --bucket "${YANDEX_BUCKET}" \
              --prefix "${STATE_KEY}" \
              --output json)"

            jq -e \
              --arg state "${STATE_KEY}" \
              --arg lock "${LOCK_KEY}" \
              '((.Versions // []) + (.DeleteMarkers // [])) |
               map(select(.Key != $state and .Key != $lock)) |
               length == 0' <<<"${inventory}" >/dev/null

            versions="$(jq -r '(.Versions // []) | length' <<<"${inventory}")"
            delete_markers="$(jq -r '(.DeleteMarkers // []) | length' <<<"${inventory}")"
            total_bytes="$(jq -r '[((.Versions // [])[]? | (.Size // 0))] | add // 0' <<<"${inventory}")"
            [[ "${versions}" =~ ^[0-9]+$ ]]
            [[ "${delete_markers}" =~ ^[0-9]+$ ]]
            [[ "${total_bytes}" =~ ^[0-9]+$ ]]
            (( total_bytes <= MAX_BUCKET_BYTES ))
            unset inventory
            printf '%s\t%s\t%s\n' "${versions}" "${delete_markers}" "${total_bytes}"
          }

          root_a="${workdir}/root-a"
          make_root "${root_a}"
          init_root "${root_a}" "${workdir}/init-a.log"
          echo '01B marker: native S3 backend initialized with use_lockfile=true'

          if [[ "${PROOF_PHASE}" == "LOCK_TEST" ]]; then
            root_b="${workdir}/root-b"
            make_root "${root_b}"
            init_root "${root_b}" "${workdir}/init-b.log"

            run_apply \
              "${root_a}" \
              "baseline-${GITHUB_RUN_ID}" \
              0 \
              "${workdir}/baseline.log"
            wait_for_lock_absent

            baseline_snapshot="$(read_state_snapshot)"
            IFS=$'\t' read -r baseline_lineage baseline_serial <<<"${baseline_snapshot}"
            baseline_etag="$(read_state_etag)"

            echo '01B marker: starting bounded normal lock holder'
