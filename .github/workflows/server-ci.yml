name: server-ci

# Path-filtered CI for the in-repo backend (/server), per ADR BD-DOCS-041.
# Kept fully separate from ci.yml (node scripts/check.mjs over public/+scripts/)
# and docs-site-ci.yml. Phase 1 only applies the SQL migrations against a real
# PostgreSQL 16 — the Node app + `npm test` job lands with the Fastify scaffold.
# public/src/ride_state.js is in the filter on purpose: the parity gate
# (server/test/ride-status-parity.test.mjs) imports that client module, so a
# client-only edit to it must still run this CI and fail on enum/transition drift.
on:
  push:
    paths:
      - 'server/**'
      - 'public/src/ride_state.js'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'public/src/ride_state.js'
      - '.github/workflows/server-ci.yml'

jobs:
  migrations:
    name: apply migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bazardrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bazardrive
    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations in order (ON_ERROR_STOP)
        run: |
          shopt -s nullglob
          for f in $(ls server/migrations/*.sql | sort); do
            echo "── applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Schema is idempotent (re-apply must be clean)
        run: |
          for f in $(ls server/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Assert core objects exist
        run: |
          # No blanket total BASE TABLE count here (deliberately removed, BD-DRIVER-VEHICLE-
          # ASSIGNMENT-AUTHORITY-01B review) — a global count is a landmine for every future
          # migration that adds a table (each one would need to bump an unrelated magic
          # number). Every load-bearing object this CI actually depends on is asserted by
          # name below instead: auth_otp/auth_session, notification_outbox (+ its function/
          # constraints/trigger), ride_history, the rides/ride_events freeze/append-only
          # triggers, and (0005) vehicle_driver_assignments/driver_active_vehicle.
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE' and table_name in ('auth_otp','auth_session')" | grep -qx 2
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE' and table_name='notification_outbox'" | grep -qx 1
          psql -v ON_ERROR_STOP=1 -tAc \
            "select to_regprocedure('public.notification_outbox_insert_guarded(uuid,jsonb,bytea,text)') is not null" | grep -qx t
          psql -v ON_ERROR_STOP=1 -tAc \
            "select 1 from information_schema.views where table_name='ride_history'" | grep -qx 1
          # pg_trigger has ONE row per trigger (information_schema.triggers has one
          # row per event, so a BEFORE UPDATE OR DELETE trigger would appear twice).
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='rides' and t.tgname='trg_rides_freeze_terminal' and not t.tgisinternal" | grep -qx 1
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='ride_events' and t.tgname='trg_ride_events_no_mutation' and not t.tgisinternal" | grep -qx 1
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='notification_outbox' and t.tgname='trg_notification_outbox_no_mutation' and not t.tgisinternal" | grep -qx 1
          # BD-DRIVER-VEHICLE-ASSIGNMENT-AUTHORITY-01B (0005) — named objects from the frozen
          # contract's data model, not just table existence.
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE' and table_name in ('vehicle_driver_assignments','driver_active_vehicle')" | grep -qx 2
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='vehicle_driver_assignments' and pc.conname='vehicle_driver_assignments_actor_xor'" | grep -qx c
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='vehicle_driver_assignments' and pc.conname='vehicle_driver_assignments_window_check'" | grep -qx c
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='vehicle_driver_assignments' and pc.conname='vehicle_driver_assignments_active_iff_not_terminated'" | grep -qx c
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='vehicle_driver_assignments' and pc.conname='vehicle_driver_assignments_id_driver_uq'" | grep -qx u
          # exclusion constraint (contype 'x') — the non-overlapping-entitlement-window guard.
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='vehicle_driver_assignments' and pc.conname='vehicle_driver_assignments_no_overlap'" | grep -qx x
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_active_vehicle' and pc.conname='driver_active_vehicle_assignment_driver_fkey'" | grep -qx f
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='vehicle_driver_assignments' and t.tgname='trg_vehicle_driver_assignments_updated_at' and not t.tgisinternal" | grep -qx 1
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='driver_active_vehicle' and t.tgname='trg_driver_active_vehicle_updated_at' and not t.tgisinternal" | grep -qx 1
          # BD-DRIVER-SHIFT-AUTHORITY-01B (0006) — named objects from the frozen contract's
          # data model, not just table existence.
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE' and table_name='driver_shift'" | grep -qx 1
          # additive composite key on vehicle_driver_assignments — coexists with 0005's own
          # vehicle_driver_assignments_id_driver_uq (asserted above, untouched).
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='vehicle_driver_assignments' and pc.conname='vehicle_driver_assignments_id_driver_vehicle_uq'" | grep -qx u
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_shift' and pc.conname='driver_shift_assignment_driver_vehicle_fkey'" | grep -qx f
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_shift' and pc.conname='driver_shift_lifecycle_check'" | grep -qx c
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_shift' and pc.conname='driver_shift_close_reason_check'" | grep -qx c
          # exclusivity backstop — partial unique indexes (contype has no row for a plain
          # index; check pg_class.relkind = 'i' instead).
          psql -v ON_ERROR_STOP=1 -tAc \
            "select relkind from pg_class where relname='driver_shift_one_open_per_driver_uq'" | grep -qx i
          psql -v ON_ERROR_STOP=1 -tAc \
            "select relkind from pg_class where relname='driver_shift_one_open_per_vehicle_uq'" | grep -qx i
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='driver_shift' and t.tgname='trg_driver_shift_guard_immutability' and not t.tgisinternal" | grep -qx 1
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='driver_shift' and t.tgname='trg_driver_shift_updated_at' and not t.tgisinternal" | grep -qx 1
          # BD-DRIVER-DOCUMENT-COMPLIANCE-01B rebuild (0007) — named objects from the frozen
          # contract's data model, not just table existence.
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_shift' and pc.conname='driver_shift_id_driver_uq'" | grep -qx u
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_shift' and pc.conname='driver_shift_id_driver_vehicle_uq'" | grep -qx u
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE' and table_name in ('driver_document_lineages','driver_documents')" | grep -qx 2
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_document_lineages' and pc.conname='driver_document_lineages_subject_shape_check'" | grep -qx c
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_document_lineages' and pc.conname='driver_document_lineages_shift_driver_fkey'" | grep -qx f
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_document_lineages' and pc.conname='driver_document_lineages_shift_driver_vehicle_fkey'" | grep -qx f
          # type-specific partial unique indexes (contype has no row for a plain index; check
          # pg_class.relkind = 'i' instead).
          for idx in driver_document_lineages_driver_license_uq driver_document_lineages_taxi_osago_uq \
                     driver_document_lineages_taxi_registry_uq driver_document_lineages_waybill_uq \
                     driver_document_lineages_medical_check_uq driver_documents_one_open_per_lineage_uq; do
            psql -v ON_ERROR_STOP=1 -tAc "select relkind from pg_class where relname='$idx'" | grep -qx i
          done
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_documents' and pc.conname='driver_documents_lineage_id_fkey'" | grep -qx f
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_documents' and pc.conname='driver_documents_supersedes_id_fkey'" | grep -qx f
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='driver_documents' and pc.conname='driver_documents_supersedes_id_key'" | grep -qx u
          # 0007 immutability guards — named BEFORE UPDATE triggers mirroring 0006's own
          # trg_driver_shift_guard_immutability assertion style (pg_trigger join, not tgisinternal).
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='driver_document_lineages' and t.tgname='trg_driver_document_lineages_guard_immutability' and not t.tgisinternal" | grep -qx 1
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='driver_documents' and t.tgname='trg_driver_documents_guard_immutability' and not t.tgisinternal" | grep -qx 1
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='driver_documents' and t.tgname='trg_driver_documents_updated_at' and not t.tgisinternal" | grep -qx 1
          # BD-MERCHANT-IDENTITY-CONTACT-AUTHORITY-01B (0009). 0008 is intentionally
          # reserved by the frozen vehicle block-state contract and is untouched here.
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE' and table_name in ('merchants','merchant_memberships','merchant_locations','external_contact_identities','merchant_contact_bindings')" | grep -qx 5
          psql -v ON_ERROR_STOP=1 -tAc \
            "select column_default from information_schema.columns where table_schema='public' and table_name='merchants' and column_name='status'" | grep -Fq SUSPENDED
          for spec in \
            merchants:merchants_display_name_check:c \
            merchants:merchants_status_check:c \
            merchant_memberships:merchant_memberships_merchant_id_fkey:f \
            merchant_memberships:merchant_memberships_user_id_fkey:f \
            merchant_memberships:merchant_memberships_role_check:c \
            merchant_memberships:merchant_memberships_status_check:c \
            merchant_memberships:merchant_memberships_lifecycle_check:c \
            merchant_locations:merchant_locations_merchant_id_fkey:f \
            merchant_locations:merchant_locations_label_check:c \
            merchant_locations:merchant_locations_address_check:c \
            merchant_locations:merchant_locations_pickup_instructions_length_check:c \
            merchant_locations:merchant_locations_status_check:c \
            merchant_locations:merchant_locations_coordinates_check:c \
            external_contact_identities:external_contact_identities_linked_user_id_fkey:f \
            external_contact_identities:external_contact_identities_canonical_uq:u \
            external_contact_identities:external_contact_identities_channel_check:c \
            external_contact_identities:external_contact_identities_namespace_check:c \
            external_contact_identities:external_contact_identities_subject_key_check:c \
            external_contact_identities:external_contact_identities_phone_check:c \
            external_contact_identities:external_contact_identities_status_check:c \
            external_contact_identities:external_contact_identities_channel_proof_check:c \
            external_contact_identities:external_contact_identities_link_shape_check:c \
            external_contact_identities:external_contact_identities_lifecycle_check:c \
            merchant_contact_bindings:merchant_contact_bindings_merchant_id_fkey:f \
            merchant_contact_bindings:merchant_contact_bindings_external_contact_identity_id_fkey:f \
            merchant_contact_bindings:merchant_contact_bindings_relationship_check:c \
            merchant_contact_bindings:merchant_contact_bindings_status_check:c \
            merchant_contact_bindings:merchant_contact_bindings_provenance_check:c \
            merchant_contact_bindings:merchant_contact_bindings_lifecycle_check:c; do
            IFS=: read -r table constraint kind <<<"$spec"
            psql -v ON_ERROR_STOP=1 -tAc \
              "select pc.contype from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='$table' and pc.conname='$constraint'" | grep -qx "$kind"
          done
          psql -v ON_ERROR_STOP=1 -tAc \
            "select exists (select 1 from pg_class ci join pg_namespace ni on ni.oid=ci.relnamespace join pg_index pi on pi.indexrelid=ci.oid where ni.nspname='public' and ci.relname='merchant_memberships_one_active_per_user_uq' and ci.relkind='i' and pi.indisunique and pg_get_indexdef(ci.oid,1,true)='merchant_id' and pg_get_indexdef(ci.oid,2,true)='user_id' and pg_get_expr(pi.indpred,pi.indrelid) like '%status%ACTIVE%')" | grep -qx t
          psql -v ON_ERROR_STOP=1 -tAc \
            "select exists (select 1 from pg_class ci join pg_namespace ni on ni.oid=ci.relnamespace join pg_index pi on pi.indexrelid=ci.oid where ni.nspname='public' and ci.relname='merchant_locations_one_active_default_uq' and ci.relkind='i' and pi.indisunique and pg_get_indexdef(ci.oid,1,true)='merchant_id' and pg_get_expr(pi.indpred,pi.indrelid) like '%status%ACTIVE%' and pg_get_expr(pi.indpred,pi.indrelid) like '%is_default_pickup%')" | grep -qx t
          psql -v ON_ERROR_STOP=1 -tAc \
            "select exists (select 1 from pg_class ci join pg_namespace ni on ni.oid=ci.relnamespace join pg_index pi on pi.indexrelid=ci.oid where ni.nspname='public' and ci.relname='merchant_contact_bindings_one_active_uq' and ci.relkind='i' and pi.indisunique and pg_get_indexdef(ci.oid,1,true)='merchant_id' and pg_get_indexdef(ci.oid,2,true)='external_contact_identity_id' and pg_get_expr(pi.indpred,pi.indrelid) like '%status%ACTIVE%')" | grep -qx t
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pg_get_constraintdef(pc.oid) from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='merchant_locations' and pc.conname='merchant_locations_pickup_instructions_length_check'" | grep -Fq 'length(pickup_instructions) <= 512'
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pg_get_constraintdef(pc.oid) from pg_constraint pc join pg_class c on c.oid=pc.conrelid where c.relname='external_contact_identities' and pc.conname='external_contact_identities_canonical_uq'" | grep -qx 'UNIQUE (channel, subject_namespace, canonical_subject_key)'
          for spec in \
            merchant_memberships:merchant_memberships_merchant_id_fkey:merchants \
            merchant_memberships:merchant_memberships_user_id_fkey:users \
            merchant_locations:merchant_locations_merchant_id_fkey:merchants \
            external_contact_identities:external_contact_identities_linked_user_id_fkey:users \
            merchant_contact_bindings:merchant_contact_bindings_merchant_id_fkey:merchants \
            merchant_contact_bindings:merchant_contact_bindings_external_contact_identity_id_fkey:external_contact_identities; do
            IFS=: read -r table constraint target <<<"$spec"
            psql -v ON_ERROR_STOP=1 -tAc \
              "select exists (select 1 from pg_constraint pc join pg_class c on c.oid=pc.conrelid join pg_class target on target.oid=pc.confrelid where c.relname='$table' and pc.conname='$constraint' and pc.contype='f' and pc.confdeltype='r' and target.relname='$target')" | grep -qx t
          done
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pg_get_triggerdef(t.oid) from pg_trigger t join pg_class c on c.oid=t.tgrelid where c.relname='merchants' and t.tgname='trg_merchants_guard_lifecycle' and not t.tgisinternal" | grep -Eq 'BEFORE.*INSERT.*UPDATE|BEFORE.*UPDATE.*INSERT'
          psql -v ON_ERROR_STOP=1 -tAc \
            "select pg_get_triggerdef(t.oid) from pg_trigger t join pg_class c on c.oid=t.tgrelid where c.relname='merchant_memberships' and t.tgname='trg_merchant_memberships_guard_immutability' and not t.tgisinternal" | grep -Eq 'BEFORE (DELETE OR UPDATE|UPDATE OR DELETE)'
          for spec in \
            merchants:trg_merchants_guard_lifecycle \
            merchants:trg_merchants_updated_at \
            merchant_memberships:trg_merchant_memberships_guard_immutability \
            merchant_memberships:trg_merchant_memberships_updated_at \
            merchant_locations:trg_merchant_locations_guard_immutability \
            merchant_locations:trg_merchant_locations_updated_at \
            external_contact_identities:trg_external_contact_identities_guard_immutability \
            external_contact_identities:trg_external_contact_identities_updated_at \
            merchant_contact_bindings:trg_merchant_contact_bindings_guard_immutability \
            merchant_contact_bindings:trg_merchant_contact_bindings_updated_at; do
            IFS=: read -r table trigger <<<"$spec"
            psql -v ON_ERROR_STOP=1 -tAc \
              "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='$table' and t.tgname='$trigger' and not t.tgisinternal" | grep -qx 1
          done
          echo "schema objects OK"

  app:
    name: app (Node 22 + npm test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bazardrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bazardrive
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Supply-chain gate (ADR BD-DOCS-041 §Consequences: "npm audit in server-ci.yml").
      - run: npm audit --omit=dev --audit-level=high
      # Prove readiness fails closed on the immediately preceding installed schema. 0008 is
      # reserved by the frozen vehicle block-state contract but does not exist in this branch;
      # therefore 0001..0007 are the complete physical pre-0009 schema today.
      - name: Apply pre-merchant-authority migrations (0001-0007) and assert readiness is incomplete
        run: |
          for f in migrations/0001_*.sql migrations/0002_*.sql migrations/0003_*.sql migrations/0004_*.sql migrations/0005_*.sql migrations/0006_*.sql migrations/0007_*.sql; do
            psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL" -f "$f"
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { buildApp } from './src/server.js';

          const app = await buildApp();
          try {
            const response = await app.inject({ method: 'GET', url: '/api/v1/readyz' });
            assert.equal(response.statusCode, 503);
            assert.deepEqual(response.json(), { status: 'degraded', db: 'schema-incomplete' });
          } finally {
            await app.close();
          }
          NODE
      # Validate the Node migration runner end-to-end against real PostgreSQL 16
      # (the migrations job above also applies the same SQL via psql).
      - run: npm run migrate
      - name: Assert readiness is complete after all migrations
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { buildApp } from './src/server.js';

          const app = await buildApp();
          try {
            const response = await app.inject({ method: 'GET', url: '/api/v1/readyz' });
            assert.equal(response.statusCode, 200);
            assert.deepEqual(response.json(), { status: 'ready', db: 'up' });
          } finally {
            await app.close();
          }
          NODE
      - run: npm test

      - name: Prove PostgreSQL outbox errors keep immutable data private
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail

          assert_setting() {
            actual="$(psql -X -v ON_ERROR_STOP=1 -A -t "$DATABASE_URL" -c "SHOW $1")"
            if [[ "$actual" != "$2" ]]; then
              echo "unsafe PostgreSQL log-test baseline: $1"
              exit 1
            fi
          }
          if [[ -z "$POSTGRES_CONTAINER_ID" ]]; then
            echo 'PostgreSQL service container ID is unavailable'
            exit 1
          fi

          # PostgreSQL defaults to logging complete bind values for sampled/duration
          # statements. Pin that independent operational path off before proving the
          # error boundary, then verify every statement/duration sampling route used by
          # core PostgreSQL logging is disabled for the test connection.
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" >/dev/null <<'SQL'
          ALTER SYSTEM SET log_parameter_max_length = 0;
          SELECT pg_reload_conf();
          SQL
          assert_setting log_error_verbosity default
          assert_setting log_min_error_statement error
          assert_setting log_statement none
          assert_setting log_duration off
          assert_setting log_min_duration_statement -1
          assert_setting log_min_duration_sample -1
          assert_setting log_transaction_sample_rate 0
          assert_setting log_parameter_max_length 0
          assert_setting log_parameter_max_length_on_error 0

          started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%NZ')"
          node --test \
            --test-name-pattern='notification outbox: guarded insert keeps PostgreSQL logs private' \
            test/notification-outbox-flow.test.mjs

          # Emit a non-sensitive end marker only after the test connection has closed.
          # Waiting for this marker prevents a snapshot that sees ERROR but misses a
          # later DETAIL/CONTEXT/STATEMENT line from the same database operation.
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" >/dev/null 2>&1 <<'SQL'
          DO $$ BEGIN RAISE WARNING 'notification-outbox-log-proof-complete'; END $$;
          SQL

          log_file="${RUNNER_TEMP:?}/notification-outbox-postgres.log"
          end_marker_found=false
          for _ in {1..100}; do
            docker logs --since "$started_at" "$POSTGRES_CONTAINER_ID" >"$log_file" 2>&1
            if grep -Fq 'notification-outbox-log-proof-complete' "$log_file"; then
              end_marker_found=true
              break
            fi
            sleep 0.1
          done
          if [[ "$end_marker_found" != true ]]; then
            echo 'PostgreSQL log proof end marker was not observed'
            exit 1
          fi
          # Take one final snapshot after the ordered marker is visible.
          sleep 0.2
          docker logs --since "$started_at" "$POSTGRES_CONTAINER_ID" >"$log_file" 2>&1
          if ! grep -Fq 'notification outbox insert failed' "$log_file"; then
            echo 'expected guarded PostgreSQL error was not logged'
            exit 1
          fi
          for forbidden in \
            'Failing row contains' \
            'BD-NOTIF-OUTBOX-LOG-CANARY' \
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa' \
            '"eventId"'; do
            if grep -Fq "$forbidden" "$log_file"; then
              echo 'PostgreSQL log privacy assertion failed'
              exit 1
            fi
          done
          if grep -Eq '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' "$log_file"; then
            echo 'PostgreSQL log contains a UUID-shaped identifier'
            exit 1
          fi

  container-smoke:
    name: container contract (build + liveness)
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: bazardrive-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Build, inspect and smoke container
        shell: bash
        run: |
          set -Eeuo pipefail

          container_id=
          cleanup() {
            status=$?
            if [[ $status -ne 0 && -n "$container_id" ]]; then
              docker logs "$container_id" || true
            fi
            if [[ -n "$container_id" ]]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          docker build \
            --build-arg "OCI_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --tag "$IMAGE_TAG" \
            server/

          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
            "$GITHUB_SHA"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')" = \
            "BazarDrive API"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.description" }}')" = \
            "BazarDrive Fastify API container"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ .Config.User }}')" = "node"

          health_cmd="$(docker image inspect "$IMAGE_TAG" --format '{{json .Config.Healthcheck.Test}}')"
          [[ "$health_cmd" == *"/api/v1/health"* ]]
          [[ "$health_cmd" != *"readyz"* ]]

          docker run --rm --entrypoint sh "$IMAGE_TAG" -c '
            test ! -e /app/.env
            test -z "$(find /app -type f -name ".env*" ! -name ".env.example" -print -quit)"
            test -z "$(find /app -type f \( -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.pfx" -o -name "*.crt" -o -name "*.cer" \) -print -quit)"
            test -z "$(find /app -type d -name secrets -print -quit)"
          '

          container_id="$(docker run -d \
            -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=production \
            -e OTP_DEV_MODE=false \
            -e ALLOWED_ORIGIN=https://example.invalid \
            -e DATABASE_URL=postgres://unavailable:unavailable@127.0.0.1:1/unavailable \
            "$IMAGE_TAG")"

          node <<'NODE'
          const expected = { status: 'ok', service: '@bazardrive/server' };
          let lastError;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              const response = await fetch('http://127.0.0.1:3000/api/v1/health');
              const body = await response.json();
              if (response.status === 200 && JSON.stringify(body) === JSON.stringify(expected)) {
                lastError = null;
                break;
              }
              lastError = new Error(`unexpected health response status ${response.status}`);
            } catch (error) {
              lastError = error;
            }
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          if (lastError) throw lastError;

          const readiness = await fetch('http://127.0.0.1:3000/api/v1/readyz');
          const readinessBody = await readiness.json();
          if (readiness.status !== 503 || readinessBody.status !== 'degraded' || readinessBody.db !== 'down') {
            throw new Error(`unexpected readiness response status ${readiness.status}`);
          }
          NODE
