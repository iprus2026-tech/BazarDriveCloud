name: temporary-lock-refresh

on:
  push:
    branches:
      - feat/bd-driver-document-compliance-01b
    paths:
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/temporary-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    name: commit audited Node 22 lockfile only
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/bd-driver-document-compliance-01b
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Regenerate lock from committed dependency policy
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove deterministic install
        run: npm ci --ignore-scripts
      - name: Prove supply-chain gate
        run: npm audit --omit=dev --audit-level=high
      - name: Commit package lock only
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix(server): refresh audited dependency lock'
          git push origin HEAD:feat/bd-driver-document-compliance-01b
