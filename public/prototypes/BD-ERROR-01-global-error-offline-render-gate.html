;}\n  .card-body{font-size:13.5px;color:var(--text-2);line-height:1.5;max-width:300px;margin:8px auto 12px;}\n  .card-code{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--text-3);padding:3px 9px;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;margin-bottom:16px;}\n  .acts{display:flex;flex-direction:column;gap:8px;}\n  .btn{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}\n  .btn.primary{background:var(--accent);color:#1a0a04;border-color:transparent;}\n  svg{display:block;}\n\n  .notes{max-width:1320px;margin:0 auto;padding:8px 28px 64px;}\n  .notes h3{font-size:14px;margin:24px 0 10px;letter-spacing:-0.01em;}\n  .ncols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;}\n  .ncard{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:15px 17px;}\n  .ncard b{font-size:12.5px;}\n  .ncard ul{margin:8px 0 0;padding-left:17px;}\n  .ncard li{font-size:12px;color:var(--text-2);line-height:1.65;}\n\n  @media print{\n    @page{size:A4 landscape;margin:7mm;}\n    :root{--scale:0.34;}\n    *,*::before,*::after{animation:none !important;}\n    body{background:#fff;color:#0a0a0c;}\n    h1{color:#0a0a0c;} .sub{color:#555;} .label{color:#333;}\n    .grid{gap:8px;max-width:none;page-break-inside:avoid;}\n    .frame{box-shadow:0 0 0 2px #2a2a2e;}\n    .notes{page-break-before:always;}\n  }\n\n  .nojs{display:none;color:var(--warning);padding:20px 28px;font-size:13px;}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<div class=\"head\">\n  <span class=\"accent\"><\u002Fspan>\n  <h1>BD-ERROR-01 · Global Error / Offline — Render Gate<\u002Fh1>\n  <div class=\"sub\">App-level overlay layer (singleton <code>window.BD.GlobalError<\u002Fcode>) shown above any screen — a sample Feed stays visible behind every state. Self-contained: no external scripts, no JSX-transform runtime, no compressed/stream-decoded assets. Five states compared side-by-side; each cell's layout box matches its scaled visual width so nothing overflows or clips in browser or A4 print.<\u002Fdiv>\n<\u002Fdiv>\n\n<noscript><div class=\"nojs\" style=\"display:block\">Для интерактивности включите JavaScript. Статичная разметка состояний рендерится без него.<\u002Fdiv><\u002Fnoscript>\n\n<div class=\"grid\" id=\"grid\"><\u002Fdiv>\n\n<div class=\"notes\">\n  <h3>Состояния<\u002Fh3>\n  <div class=\"ncols\">\n    <div class=\"ncard\"><b>1 · Offline banner<\u002Fb><ul><li>Компактный красный верхний баннер, пульсирующая точка<\u002Fli><li>«Нет соединения» + авто-обновление<\u002Fli><li>Non-blocking<\u002Fli><\u002Ful><\u002Fdiv>\n    <div class=\"ncard\"><b>2 · Server error<\u002Fb><ul><li>Затемнение + нижний лист<\u002Fli><li>Красная иконка, SERVER · 500<\u002Fli><li>Повторить / Поддержка<\u002Fli><\u002Ful><\u002Fdiv>\n    <div class=\"ncard\"><b>3 · Timeout<\u002Fb><ul><li>Нижний лист, янтарные часы<\u002Fli><li>TIMEOUT · 504<\u002Fli><li>Повторить / Позже<\u002Fli><\u002Ful><\u002Fdiv>\n    <div class=\"ncard\"><b>4 · Retrying<\u002Fb><ul><li>Синий верхний баннер, спиннер<\u002Fli><li>«Переподключение…»<\u002Fli><li>Non-blocking<\u002Fli><\u002Ful><\u002Fdiv>\n    <div class=\"ncard\"><b>5 · Recovered<\u002Fb><ul><li>Зелёный нижний тост<\u002Fli><li>«Соединение восстановлено»<\u002Fli><li>Авто-скрытие ~3 c<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n  <h3>Screen-contract<\u002Fh3>\n  <div class=\"ncard\">\n    <ul>\n      <li>Singleton overlay, владелец — app shell; управляется глобальным connection / lastError store, не per-route.<\u002Fli>\n      <li>Монтируется идентично над Feed, Profile, Order Detail, Driver Map, Active Ride.<\u002Fli>\n      <li>Offline / Retrying — non-blocking баннеры; Server / Timeout — scrim + bottom sheet, перехватывают взаимодействие до Повторить/dismiss.<\u002Fli>\n      <li>Recovered toast авто-скрывается ~3 c. «Повторить» повторяет последнее упавшее действие.<\u002Fli>\n      <li>Никогда не мутирует ride/order state; не подавляет собственные empty/loading/error экрана. Только транспортные сбои. Connection state — mock / navigator.onLine.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  \"use strict\";\n  var NS=\"http://www.w3.org/2000/svg\";\n  function svg(paths,size,stroke){\n    var s=document.createElementNS(NS,\"svg\");\n    s.setAttribute(\"viewBox\",\"0 0 24 24\");s.setAttribute(\"width\",size||16);s.setAttribute(\"height\",size||16);\n    s.setAttribute(\"fill\",\"none\");s.setAttribute(\"stroke\",\"currentColor\");\n    s.setAttribute(\"stroke-width\",stroke||2);s.setAttribute(\"stroke-linecap\",\"round\");s.setAttribute(\"stroke-linejoin\",\"round\");\n    paths.forEach(function(d){var p=document.createElementNS(NS,\"path\");p.setAttribute(\"d\",d);s.appendChild(p);});\n    return s;\n  }\n  var IC={\n    warn:[\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\",\"M12 9v4\",\"M12 17h.01\"],\n    clock:[\"M12 12 12 7\",\"M12 12 15 14\"], // plus circle added separately\n    check:[\"M20 6 9 17l-5-5\"],\n    sparkle:[\"M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8\"]\n  };\n  function icon(name,size,stroke){\n    if(name===\"clock\"){\n      var s=document.createElementNS(NS,\"svg\");\n      s.setAttribute(\"viewBox\",\"0 0 24 24\");s.setAttribute(\"width\",size);s.setAttribute(\"height\",size);\n      s.setAttribute(\"fill\",\"none\");s.setAttribute(\"stroke\",\"currentColor\");s.setAttribute(\"stroke-width\",stroke||2);\n      s.setAttribute(\"stroke-linecap\",\"round\");s.setAttribute(\"stroke-linejoin\",\"round\");\n      var c=document.createElementNS(NS,\"circle\");c.setAttribute(\"cx\",\"12\");c.setAttribute(\"cy\",\"12\");c.setAttribute(\"r\",\"9\");s.appendChild(c);\n      var p=document.createElementNS(NS,\"path\");p.setAttribute(\"d\",\"M12 7v5l3 2\");s.appendChild(p);\n      return s;\n    }\n    return svg(IC[name],size,stroke);\n  }\n  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}\n\n  // ---- base feed backdrop ----\n  function feedBase(){\n    var scr=el(\"div\",\"scr\");\n    var sb=el(\"div\",\"statusbar\");sb.appendChild(el(\"span\",null,\"9:41\"));sb.appendChild(el(\"span\",null,\"BazarDrive\"));scr.appendChild(sb);\n    var tb=el(\"div\",\"topbar\");var h=el(\"h2\",null,\"Лента\");tb.appendChild(h);var ts=el(\"div\",\"ts\",\"Поездки · попутчики · маркет\");tb.appendChild(ts);scr.appendChild(tb);\n    var feed=el(\"div\",\"feed\");\n    var grads=[\"linear-gradient(135deg,#FF8a5c,#C2410C)\",\"linear-gradient(135deg,#6BCBFF,#3A7BD5)\",\"linear-gradient(135deg,#A78BFA,#7C3AED)\",\"linear-gradient(135deg,#4ADE80,#16A34A)\"];\n    for(var i=0;i<4;i++){\n      var c=el(\"div\",\"fcard\");\n      var row=el(\"div\",\"frow\");\n      var av=el(\"div\",\"av\");av.style.background=grads[i%grads.length];row.appendChild(av);\n      var col=el(\"div\",\"flex1\");\n      var l1=el(\"div\",\"ln\");l1.style.width=(55+i*8)+\"%\";l1.style.marginBottom=\"6px\";col.appendChild(l1);\n      var l2=el(\"div\",\"ln\");l2.style.width=\"36%\";l2.style.opacity=\"0.6\";col.appendChild(l2);\n      row.appendChild(col);\n      row.appendChild(el(\"span\",\"pill\",i%2?\"Попутчик\":\"Поездка\"));\n      c.appendChild(row);\n      var b1=el(\"div\",\"ln\");b1.style.width=\"92%\";b1.style.marginBottom=\"7px\";c.appendChild(b1);\n      var b2=el(\"div\",\"ln\");b2.style.width=\"74%\";b2.style.opacity=\"0.55\";c.appendChild(b2);\n      feed.appendChild(c);\n    }\n    scr.appendChild(feed);\n    var nav=el(\"div\",\"navbar\");\n    [[\"Лента\",1],[\"Карта\",0],[\"Правила\",0],[\"Профиль\",0]].forEach(function(n){\n      var v=el(\"div\",\"nav\"+(n[1]?\" on\":\"\"));v.appendChild(el(\"i\"));v.appendChild(el(\"span\",null,n[0]));nav.appendChild(v);\n    });\n    scr.appendChild(nav);\n    return scr;\n  }\n\n  function topBanner(kind){\n    var b=el(\"div\",\"banner \"+(kind===\"retry\"?\"retry\":\"offline\"));\n    if(kind===\"retry\"){b.appendChild(el(\"span\",\"spin\"));}\n    else{b.appendChild(el(\"span\",\"pulse-dot\"));}\n    var c=el(\"div\",\"flex1\");\n    c.appendChild(el(\"div\",\"bn-title\",kind===\"retry\"?\"Переподключение…\":\"Нет соединения\"));\n    c.appendChild(el(\"div\",\"bn-sub\",kind===\"retry\"?\"Пытаемся восстановить связь\":\"Проверьте интернет — данные обновятся автоматически\"));\n    b.appendChild(c);\n    if(kind!==\"retry\"){var ic=el(\"span\",\"ico\");ic.style.color=\"var(--danger)\";ic.style.opacity=\"0.8\";ic.appendChild(icon(\"warn\",16,2));b.appendChild(ic);}\n    return b;\n  }\n  function toast(){\n    var t=el(\"div\",\"toast\");\n    var ic=el(\"span\",\"toast-ic\");ic.appendChild(icon(\"check\",15,2.6));t.appendChild(ic);\n    t.appendChild(el(\"span\",\"flex1\",\"Соединение восстановлено\"));\n    return t;\n  }\n  function errorCard(kind){\n    var timeout=kind===\"timeout\";\n    var wrap=el(\"div\",\"sheet-wrap\");\n    wrap.appendChild(el(\"div\",\"scrim\"));\n    var card=el(\"div\",\"card\");\n    card.appendChild(el(\"div\",\"grab\"));\n    var ic=el(\"div\",\"card-ic \"+(timeout?\"warning\":\"danger\"));ic.appendChild(icon(timeout?\"clock\":\"warn\",26,2.1));card.appendChild(ic);\n    card.appendChild(el(\"div\",\"card-title\",timeout?\"Превышено время ожидания\":\"Что-то пошло не так\"));\n    card.appendChild(el(\"div\",\"card-body\",timeout?\"Сервер не ответил вовремя. Попробуйте ещё раз — это обычно временно.\":\"Не удалось загрузить данные. Мы уже знаем о проблеме — попробуйте повторить.\"));\n    card.appendChild(el(\"div\",\"card-code\",timeout?\"TIMEOUT · 504\":\"SERVER · 500\"));\n    var acts=el(\"div\",\"acts\");\n    var b1=el(\"button\",\"btn primary\");b1.appendChild(icon(\"sparkle\",16,2));b1.appendChild(el(\"span\",null,\"Повторить\"));acts.appendChild(b1);\n    var b2=el(\"button\",\"btn\",timeout?\"Позже\":\"Поддержка\");acts.appendChild(b2);\n    card.appendChild(acts);\n    wrap.appendChild(card);\n    return wrap;\n  }\n\n  var STATES=[\n    {v:\"offline\",label:\"1 · Offline banner\",build:function(s){s.appendChild(topBanner(\"offline\"));}},\n    {v:\"server_error\",label:\"2 · Server error card\",build:function(s){var d=el(\"div\",\"dim\");s.appendChild(d);s.appendChild(errorCard(\"server\"));}},\n    {v:\"timeout\",label:\"3 · Timeout card\",build:function(s){var d=el(\"div\",\"dim\");s.appendChild(d);s.appendChild(errorCard(\"timeout\"));}},\n    {v:\"retrying\",label:\"4 · Retrying\",build:function(s){s.appendChild(topBanner(\"retry\"));}},\n    {v:\"recovered\",label:\"5 · Recovered toast\",build:function(s){s.appendChild(toast());}}\n  ];\n\n  var grid=document.getElementById(\"grid\");\n  STATES.forEach(function(st){\n    var cell=el(\"div\",\"cell\");\n    var box=el(\"div\",\"frame-box\");\n    var frame=el(\"div\",\"frame\");\n    frame.appendChild(feedBase());\n    st.build(frame);\n    box.appendChild(frame);\n    cell.appendChild(box);\n    cell.appendChild(el(\"div\",\"label\",st.label));\n    grid.appendChild(cell);\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
