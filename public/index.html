<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B35">
  <!-- BD-MAP-FOUND-01 / BD-MAP-ACTIVATE (#805): CSP for the (vendored, 'self') Mapbox GL JS —
       connect-src/img-src to *.mapbox.com (tiles / styles / glyphs / sprites / telemetry),
       worker-src + child-src blob: (its GL web worker), and style-src 'unsafe-inline' (mapbox-gl v3
       injects inline control styles — Codex #813). script-src stays 'self' (the SDK is vendored, not a
       CDN). With the bd-mapbox-token meta below set, the map path is now ACTIVE on the Pages origin. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.mapbox.com; font-src 'self'; connect-src 'self' https://*.mapbox.com; manifest-src 'self'; worker-src 'self' blob:; child-src blob:; base-uri 'none'; object-src 'none'; form-action 'none';">
  <!-- BD-MAP-ACTIVATE (#805): the Mapbox public token read by mapbox_config.getMapboxToken(). This is the
       dedicated "BazarDriveCloud GitHub Pages Web Token" — a URL-RESTRICTED public token (allowed URL:
       iprus2026-tech.github.io), NOT the unrestricted default — so committing it is safe (a public pk.*
       token is client-exposed by design; the URL restriction prevents off-domain quota abuse). This is
       what flips the Mapbox dark seam ON: /map (and future surfaces) now render a real map. -->
  <meta name="bd-mapbox-token" content="pk.eyJ1IjoibXJ6ZWwiLCJhIjoiY21yMTV6Y2xhMGYxbDJxc2Rpc25kNmx4ZiJ9.MZgziXJsfD73GMgBOALkKw">
  <title>BazarDrive</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles/cloud.css">
  <link rel="stylesheet" href="./styles/map_shell_foundation.css">
  <link rel="stylesheet" href="./styles/route_picker.css">
  <link rel="stylesheet" href="./styles/route_picker_layout_fix.css">
  <link rel="stylesheet" href="./styles/route_preview.css">
  <link rel="stylesheet" href="./styles/order_map_draft.css">
  <link rel="stylesheet" href="./styles/daily_communication.css">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/maskable-192.png">
</head>
<body>
  <div id="shell">
    <main id="app" role="main"></main>

    <nav id="tabbar" class="tabbar" aria-label="Основная навигация" hidden>
      <button class="tab-btn" data-route="/feed" type="button" aria-label="Лента">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Лента</span>
      </button>
      <button class="tab-btn" data-route="/map" type="button" aria-label="Карта">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="3 6 9 4 15 6 21 4 21 18 15 20 9 18 3 20 3 6"/>
          <line x1="9" y1="4" x2="9" y2="18"/>
          <line x1="15" y1="6" x2="15" y2="20"/>
        </svg>
        <span>Карта</span>
      </button>
      <button class="tab-btn" data-route="/rules" type="button" aria-label="Правила">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <line x1="9" y1="12" x2="15" y2="12"/>
          <line x1="9" y1="16" x2="13" y2="16"/>
        </svg>
        <span>Правила</span>
      </button>
      <button class="tab-btn" data-route="/profile" type="button" aria-label="Профиль">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.582-7 8-7s8 3 8 7"/>
        </svg>
        <span>Профиль</span>
      </button>
    </nav>

    <div id="sw-update-banner" class="sw-update-banner" hidden role="status" aria-live="polite">
      <span class="sw-update-banner__text">Доступна новая версия BazarDrive</span>
      <button id="sw-update-btn" class="bd-btn primary sm sw-update-banner__btn" type="button">Обновить</button>
    </div>

    <button id="fab" class="fab" type="button" hidden aria-label="Новое объявление">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
