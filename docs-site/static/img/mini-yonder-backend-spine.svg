    <rect x="18" y="20" width="154" height="30" rx="15" fill="#1C202B"/>
    <circle cx="33" cy="35" r="6" fill="#FF6B35"/>
    <text x="49" y="40" fill="#F6F2EA" font-family="Inter, Arial" font-size="12" font-weight="700">API Contracts</text>
    <rect x="18" y="72" width="154" height="44" rx="14" fill="url(#accent)"/>
    <text x="30" y="98" fill="#120B08" font-family="Inter, Arial" font-size="11" font-weight="800">POST /orders/:id/accept</text>
    <rect x="18" y="132" width="72" height="36" rx="12" fill="#19231E"/>
    <text x="30" y="154" fill="#86E8B6" font-family="Inter, Arial" font-size="10">auth ✓</text>
    <rect x="100" y="132" width="72" height="36" rx="12" fill="#241D18"/>
    <text x="112" y="154" fill="#FFB08A" font-family="Inter, Arial" font-size="10">role ⚠</text>
    <rect x="18" y="182" width="154" height="72" rx="16" fill="#10121A" stroke="#2B3040"/>
    <text x="30" y="205" fill="#F6F2EA" font-family="Inter, Arial" font-size="11" font-weight="700">Transaction writes</text>
    <text x="30" y="224" fill="#9EA3B5" font-family="Inter, Arial" font-size="9">orders.status</text>
    <text x="30" y="238" fill="#9EA3B5" font-family="Inter, Arial" font-size="9">responses rejected</text>
    <text x="30" y="252" fill="#9EA3B5" font-family="Inter, Arial" font-size="9">ride_events insert</text>
  </g>

  <g transform="translate(80 535)" filter="url(#shadow)">
    <rect width="190" height="315" rx="28" fill="#13151E" stroke="#313545"/>
    <rect x="18" y="20" width="154" height="30" rx="15" fill="#1C202B"/>
    <circle cx="33" cy="35" r="6" fill="#FF6B35"/>
    <text x="49" y="40" fill="#F6F2EA" font-family="Inter, Arial" font-size="12" font-weight="700">DB Schema</text>
    <rect x="18" y="72" width="154" height="38" rx="12" fill="#1B1E29"/>
    <text x="30" y="96" fill="#F6F2EA" font-family="Inter, Arial" font-size="11" font-weight="700">rides</text>
    <rect x="18" y="122" width="154" height="96" rx="16" fill="#10121A" stroke="#2B3040"/>
    <text x="30" y="146" fill="#B9C0D4" font-family="Inter, Arial" font-size="9">id · order_id</text>
    <text x="30" y="162" fill="#B9C0D4" font-family="Inter, Arial" font-size="9">passenger_id · driver_id</text>
    <text x="30" y="178" fill="#B9C0D4" font-family="Inter, Arial" font-size="9">status · pickup_lng</text>
    <text x="30" y="194" fill="#B9C0D4" font-family="Inter, Arial" font-size="9">created_at · updated_at</text>
    <rect x="18" y="232" width="154" height="42" rx="14" fill="#241D18"/>
    <text x="30" y="257" fill="#FFB08A" font-family="Inter, Arial" font-size="10">migration needed</text>
  </g>

  <g transform="translate(300 535)" filter="url(#shadow)">
    <rect width="190" height="315" rx="28" fill="#13151E" stroke="#313545"/>
    <rect x="18" y="20" width="154" height="30" rx="15" fill="#1C202B"/>
    <circle cx="33" cy="35" r="6" fill="#FF6B35"/>
    <text x="49" y="40" fill="#F6F2EA" font-family="Inter, Arial" font-size="12" font-weight="700">Contract Diff</text>
    <rect x="18" y="76" width="154" height="54" rx="16" fill="#10121A" stroke="#2B3040"/>
    <text x="30" y="99" fill="#F6F2EA" font-family="Inter, Arial" font-size="11" font-weight="700">Frontend</text>
    <text x="30" y="117" fill="#B9C0D4" font-family="Inter, Arial" font-size="9">DRIVER_EN_ROUTE</text>
    <rect x="18" y="145" width="154" height="54" rx="16" fill="#10121A" stroke="#2B3040"/>
    <text x="30" y="168" fill="#F6F2EA" font-family="Inter, Arial" font-size="11" font-weight="700">Backend DTO</text>
    <text x="30" y="186" fill="#B9C0D4" font-family="Inter, Arial" font-size="9">arriving</text>
    <rect x="18" y="214" width="154" height="54" rx="16" fill="#211A16" stroke="#5A3524"/>
    <text x="30" y="237" fill="#FFB08A" font-family="Inter, Arial" font-size="11" font-weight="700">Mapping missing</text>
    <text x="30" y="255" fill="#FFB08A" font-family="Inter, Arial" font-size="9">add enum bridge</text>
  </g>

  <g transform="translate(520 535)" filter="url(#shadow)">
    <rect width="190" height="315" rx="28" fill="#13151E" stroke="#313545"/>
    <rect x="18" y="20" width="154" height="30" rx="15" fill="#1C202B"/>
    <circle cx="33" cy="35" r="6" fill="#FF6B35"/>
    <text x="49" y="40" fill="#F6F2EA" font-family="Inter, Arial" font-size="12" font-weight="700">Issue Generator</text>
    <rect x="18" y="74" width="154" height="92" rx="18" fill="#10121A" stroke="#2B3040"/>
    <text x="30" y="101" fill="#F6F2EA" font-family="Inter, Arial" font-size="11" font-weight="700">BD-BACKEND-01</text>
    <text x="30" y="120" fill="#9EA3B5" font-family="Inter, Arial" font-size="9">orders spine</text>
    <text x="30" y="136" fill="#9EA3B5" font-family="Inter, Arial" font-size="9">db + api + smoke</text>
    <rect x="18" y="182" width="154" height="44" rx="16" fill="url(#accent)"/>
    <text x="42" y="209" fill="#120B08" font-family="Inter, Arial" font-size="12" font-weight="800">Create prompt</text>
    <rect x="18" y="242" width="154" height="34" rx="12" fill="#1B1E29"/>
    <text x="36" y="263" fill="#B9C0D4" font-family="Inter, Arial" font-size="10">Open GitHub issue</text>
  </g>

  <g transform="translate(785 225)">
    <rect width="525" height="520" rx="34" fill="#10121A" stroke="#303445"/>
    <text x="34" y="54" fill="#F6F2EA" font-family="Inter, Arial" font-size="26" font-weight="800">Build integration contract</text>
    <text x="34" y="86" fill="#9EA3B5" font-family="Inter, Arial" font-size="16">Docs-site page + governed sidebar + static asset.</text>
    <rect x="34" y="126" width="457" height="62" rx="18" fill="#171A24"/>
    <text x="56" y="152" fill="#FFB08A" font-family="Inter, Arial" font-size="13" font-weight="800">1. docs-site/docs/processes/backend-spine-inspector.md</text>
    <text x="56" y="173" fill="#B9C0D4" font-family="Inter, Arial" font-size="12">Governed passport, route, scope, acceptance checklist.</text>
    <rect x="34" y="208" width="457" height="62" rx="18" fill="#171A24"/>
    <text x="56" y="234" fill="#FFB08A" font-family="Inter, Arial" font-size="13" font-weight="800">2. docs-site/static/img/mini-yonder-backend-spine.svg</text>
    <text x="56" y="255" fill="#B9C0D4" font-family="Inter, Arial" font-size="12">Six-screen visual reference for the feature.</text>
    <rect x="34" y="290" width="457" height="62" rx="18" fill="#171A24"/>
    <text x="56" y="316" fill="#FFB08A" font-family="Inter, Arial" font-size="13" font-weight="800">3. docs-site/sidebars.js</text>
    <text x="56" y="337" fill="#B9C0D4" font-family="Inter, Arial" font-size="12">Visible in Processes, not hidden slug-only.</text>
    <rect x="34" y="392" width="457" height="76" rx="20" fill="#201915" stroke="#5A3524"/>
    <text x="56" y="422" fill="#FFB08A" font-family="Inter, Arial" font-size="14" font-weight="800">Boundaries</text>
    <text x="56" y="445" fill="#F6F2EA" font-family="Inter, Arial" font-size="12">No runtime PWA changes. No backend implementation. No CSP/SW touch.</text>
  </g>
</svg>
