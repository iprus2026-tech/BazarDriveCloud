<svg width="1440" height="980" viewBox="0 0 1440 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mini Yonder Backend Spine screens</title>
  <desc id="desc">Six dark mobile screens for Backend Spine, Data Trace, API Contracts, DB Schema, Contract Diff and Issue Generator.</desc>
  <rect width="1440" height="980" rx="42" fill="#08090D"/>
  <rect x="34" y="34" width="1372" height="912" rx="38" fill="#0D0E14" stroke="#242735"/>
  <text x="80" y="92" fill="#F6F2EA" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Mini Yonder Backend Spine &amp; DB Inspector</text>
  <text x="80" y="126" fill="#9EA3B5" font-family="Inter, Arial, sans-serif" font-size="18">Screen → state → API → service → database → checks → issue</text>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8A4C"/>
      <stop offset="1" stop-color="#FF4D1D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g transform="translate(80 170)" filter="url(#shadow)">
    <rect width="190" height="315" rx="28" fill="#13151E" stroke="#313545"/>
    <rect x="18" y="20" width="154" height="30" rx="15" fill="#1C202B"/>
    <circle cx="33" cy="35" r="6" fill="#FF6B35"/>
    <text x="49" y="40" fill="#F6F2EA" font-family="Inter, Arial" font-size="12" font-weight="700">Backend Spine</text>
    <rect x="18" y="68" width="154" height="50" rx="14" fill="#191C26"/>
    <text x="30" y="90" fill="#F6F2EA" font-family="Inter, Arial" font-size="13" font-weight="700">Orders</text>
    <text x="30" y="108" fill="#FFB08A" font-family="Inter, Arial" font-size="10">API_CONTRACT_READY</text>
    <rect x="18" y="130" width="154" height="34" rx="12" fill="#1A2230"/>
    <text x="30" y="151" fill="#B9C0D4" font-family="Inter, Arial" font-size="10">Profiles · READY</text>
    <rect x="18" y="174" width="154" height="34" rx="12" fill="#241D18"/>
    <text x="30" y="195" fill="#FFB08A" font-family="Inter, Arial" font-size="10">Rides · GUARD_MISSING</text>
    <rect x="18" y="218" width="154" height="62" rx="16" fill="#10121A" stroke="#2B3040"/>
    <text x="30" y="241" fill="#F6F2EA" font-family="Inter, Arial" font-size="11" font-weight="700">Risk radar</text>
    <text x="30" y="259" fill="#9EA3B5" font-family="Inter, Arial" font-size="9">role authority</text>
    <text x="30" y="273" fill="#9EA3B5" font-family="Inter, Arial" font-size="9">status transition</text>
  </g>

  <g transform="translate(300 170)" filter="url(#shadow)">
    <rect width="190" height="315" rx="28" fill="#13151E" stroke="#313545"/>
    <rect x="18" y="20" width="154" height="30" rx="15" fill="#1C202B"/>
    <circle cx="33" cy="35" r="6" fill="#FF6B35"/>
    <text x="49" y="40" fill="#F6F2EA" font-family="Inter, Arial" font-size="12" font-weight="700">Data Trace</text>
    <g stroke="#FF6B35" stroke-width="2" stroke-linecap="round">
      <path d="M46 80 L46 246"/>
      <path d="M46 246 L68 246"/>
    </g>
    <circle cx="46" cy="82" r="8" fill="#FF6B35"/>
    <circle cx="46" cy="124" r="8" fill="#FF6B35" opacity="0.75"/>
    <circle cx="46" cy="166" r="8" fill="#FF6B35" opacity="0.55"/>
    <circle cx="46" cy="208" r="8" fill="#FF6B35" opacity="0.4"/>
    <text x="68" y="87" fill="#F6F2EA" font-family="Inter, Arial" font-size="11" font-weight="700">/active-ride</text>
    <text x="68" y="129" fill="#B9C0D4" font-family="Inter, Arial" font-size="10">ride_state.js</text>
    <text x="68" y="171" fill="#B9C0D4" font-family="Inter, Arial" font-size="10">GET /rides/:id</text>
    <text x="68" y="213" fill="#B9C0D4" font-family="Inter, Arial" font-size="10">rides table</text>
    <rect x="18" y="250" width="154" height="36" rx="13" fill="#211A16"/>
    <text x="30" y="272" fill="#FFB08A" font-family="Inter, Arial" font-size="10">STATUS_DRIFT found</text>
  </g>

